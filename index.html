      ${fld('Contact email', `<input class="i" id="d_ce" type="email" value="${esc(d.contact_email || '')}">`)}${fld('Notes', `<textarea class="i" id="d_notes">${esc(d.notes || '')}</textarea>`)}
      ${fld('Status', `<select class="i" id="d_act">${opts([{ id: 'true', name: 'Active' }, { id: 'false', name: 'Inactive' }], String(d.active !== false))}</select>`)}</div>`,
    { save: async () => { const row = { org_id: A.m.org_id, name: $('d_name').value.trim(), contact_name: $('d_cn').value.trim() || null, contact_email: $('d_ce').value.trim() || null, notes: $('d_notes').value.trim() || null, active: $('d_act').value === 'true' };
      if (!row.name) { toast('Enter a donor name', true); return false; }
      if (d.id) await q(sb.from('donors').update(row).eq('id', d.id)); else await q(sb.from('donors').insert(row)); toast('Donor saved'); await reload(); } });
  const aForm = a => modal(a.id ? 'Edit allocation' : 'Add funding allocation', `<div class="fld grid g2" style="gap:0 14px">
      ${fld('Donor', `<select class="i" id="a_d">${opts(A.ref.donors, a.donor_id)}</select>`)}${fld('Programme', `<select class="i" id="a_p">${opts(A.ref.progs, a.programme_id)}</select>`)}
      ${fld('Hub', `<select class="i" id="a_h">${opts(A.ref.hubs, a.hub_id, 'All hubs')}</select>`)}${fld('Amount (R)', `<input class="i" id="a_amt" type="number" min="0" step="1000" value="${esc(a.amount || '')}">`)}
      ${fld('Start date', `<input class="i" id="a_s" type="date" value="${esc(a.start_date || today())}">`)}${fld('End date', `<input class="i" id="a_e" type="date" value="${esc(a.end_date || addDays(today(), 364))}">`)}
      ${fld('Notes', `<input class="i" id="a_n" value="${esc(a.notes || '')}">`, true)}</div>`,
    { save: async () => { const row = { org_id: A.m.org_id, donor_id: $('a_d').value, programme_id: $('a_p').value, hub_id: $('a_h').value || null, amount: Number($('a_amt').value || 0), start_date: $('a_s').value, end_date: $('a_e').value, notes: $('a_n').value.trim() || null };
      if (!row.donor_id || !row.programme_id) { toast('Choose a donor and a programme', true); return false; }
      if (row.end_date < row.start_date) { toast('End date must be after start date', true); return false; }
      if (a.id) await q(sb.from('funding_allocations').update(row).eq('id', a.id)); else await q(sb.from('funding_allocations').insert(row)); toast('Allocation saved'); await reload(); } });
  $('addD').onclick = () => dForm({});
  $('addAl').onclick = () => A.ref.donors.length && A.ref.progs.length ? aForm({}) : toast('Add a donor and a programme first', true);
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => dForm(byId(A.ref.donors, b.dataset.ed)));
  document.querySelectorAll('[data-ea]').forEach(b => b.onclick = () => aForm(byId(A.ref.allocs, b.dataset.ea)));
  document.querySelectorAll('[data-da]').forEach(b => b.onclick = async () => { if (!await confirmDlg('Delete allocation?', 'Reports for this donor will no longer include this programme.', 'Delete')) return; try { await q(sb.from('funding_allocations').delete().eq('id', b.dataset.da)); await reload(); } catch (e) { fail(e); } });
}

async function aUsers() {
  const [mh, mp] = await Promise.all([q(sb.from('member_hubs').select('*').eq('org_id', A.m.org_id)), q(sb.from('member_programmes').select('*').eq('org_id', A.m.org_id))]);
  $('aout').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="muted">Add a person here, then ask them to open the app and choose <b>Create your account</b> with the same email.</div><button class="btn" id="addU">+ Add user</button></div>
    ${tbl(['Name', 'Email', 'Role', 'Access', 'Account', ''], A.ref.members.map(m => `<tr><td><b>${esc(m.full_name)}</b></td><td>${esc(m.email)}</td><td>${esc(ROLE_LABEL[m.role])}</td>
      <td>${m.role === 'donor_viewer' ? chip(nameOf(A.ref.donors, m.donor_id)) : MANAGERS.includes(m.role) ? '<span class="faint">All hubs</span>' :
        [...mh.filter(x => x.member_id === m.id).map(x => chip(nameOf(A.ref.hubs, x.hub_id).replace(' Community Hub', ''))), ...mp.filter(x => x.member_id === m.id).map(x => chip(nameOf(A.ref.progs, x.programme_id)))].join('') || '<span class="faint">None</span>'}</td>
      <td>${m.user_id ? '<span class="badge">Linked</span>' : '<span class="badge grey">Invited</span>'} ${m.active ? '' : '<span class="badge grey">Disabled</span>'}</td>
      <td><button class="btn sm sec" data-u="${m.id}">Edit</button></td></tr>`))}
    <div class="note" style="margin-top:12px"><b>Roles:</b> Super Administrator — full control · Management — all Hubs, dashboards & reports · Hub Manager — their Hubs, kiosk links & reports · Hub Staff — visitor & service management at their Hubs · Programme Manager — their programmes' data & reporting · Donor Viewer — their own impact report only, never beneficiary details.</div>`;
  const form = m => {
    const hubs = new Set(mh.filter(x => x.member_id === m.id).map(x => x.hub_id)), progs = new Set(mp.filter(x => x.member_id === m.id).map(x => x.programme_id));
    const roles = Object.keys(ROLE_LABEL).filter(r => r !== 'super_admin' || role() === 'super_admin' || m.role === 'super_admin');
    const w = modal(m.id ? 'Edit user' : 'Add user', `<div class="fld grid g2" style="gap:0 14px">
      ${fld('Full name', `<input class="i" id="u_name" value="${esc(m.full_name || '')}">`)}${fld('Email', `<input class="i" id="u_email" type="email" value="${esc(m.email || '')}" ${m.user_id ? 'disabled' : ''}>`)}
      ${fld('Role', `<select class="i" id="u_role">${opts(roles.map(r => ({ id: r, name: ROLE_LABEL[r] })), m.role || 'hub_staff')}</select>`)}
      ${fld('Status', `<select class="i" id="u_act">${opts([{ id: 'true', name: 'Active' }, { id: 'false', name: 'Disabled' }], String(m.active !== false))}</select>`)}</div>
      <div id="u_donor"><label class="lb">Donor (for Donor Viewers)</label><select class="i" id="u_d" style="width:100%">${opts(A.ref.donors, m.donor_id, 'Select donor')}</select></div>
      <div id="u_hubs"><label class="lb">Hubs</label><div class="checks">${A.ref.hubs.map(h => `<label><input type="checkbox" data-h value="${h.id}" ${hubs.has(h.id) ? 'checked' : ''}> ${esc(h.name)}</label>`).join('')}</div></div>
      <div id="u_progs"><label class="lb">Programmes (for Programme Managers)</label><div class="checks">${A.ref.progs.map(p => `<label><input type="checkbox" data-p value="${p.id}" ${progs.has(p.id) ? 'checked' : ''}> ${esc(p.name)}</label>`).join('')}</div></div>`,
    { save: async w => {
      const row = { org_id: A.m.org_id, full_name: $('u_name').value.trim(), role: $('u_role').value, active: $('u_act').value === 'true', donor_id: $('u_role').value === 'donor_viewer' ? ($('u_d').value || null) : null };
      if (!m.id) row.email = $('u_email').value.trim().toLowerCase();
      if (!row.full_name || (!m.id && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(row.email))) { toast('Enter a name and a valid email', true); return false; }
      if (row.role === 'donor_viewer' && !row.donor_id) { toast('Choose the donor this person may view', true); return false; }
      if (m.id === A.m.member_id && (row.role !== m.role || !row.active)) { toast('You cannot change your own role or disable yourself', true); return false; }
      const saved = m.id ? await q(sb.from('members').update(row).eq('id', m.id).select().single()) : await q(sb.from('members').insert(row).select().single());
      await q(sb.from('member_hubs').delete().eq('member_id', saved.id));
      await q(sb.from('member_programmes').delete().eq('member_id', saved.id));
      const hs = ['hub_manager', 'hub_staff', 'programme_manager'].includes(row.role) ? [...w.querySelectorAll('[data-h]:checked')].map(i => i.value) : [];
      const ps = row.role === 'programme_manager' ? [...w.querySelectorAll('[data-p]:checked')].map(i => i.value) : [];
      if (hs.length) await q(sb.from('member_hubs').insert(hs.map(h => ({ member_id: saved.id, hub_id: h, org_id: A.m.org_id }))));
      if (ps.length) await q(sb.from('member_programmes').insert(ps.map(p => ({ member_id: saved.id, programme_id: p, org_id: A.m.org_id }))));
      toast(m.id ? 'User updated' : 'User added — ask them to create their account with ' + row.email); await reload();
    } });
    const sync = () => { const r = $('u_role').value; $('u_donor').classList.toggle('hidden', r !== 'donor_viewer'); $('u_hubs').classList.toggle('hidden', !['hub_manager', 'hub_staff', 'programme_manager'].includes(r)); $('u_progs').classList.toggle('hidden', r !== 'programme_manager'); };
    $('u_role').onchange = sync; sync();
  };
  $('addU').onclick = () => form({ active: true });
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => form(byId(A.ref.members, b.dataset.u)));
}

async function aCommunities() {
  simpleCrud({ table: 'communities', title: 'community', rows: A.ref.comms, cols: ['Community', 'Shown at'], allowDelete: true,
    render: c => [esc(c.name), esc(c.hub_id ? nameOf(A.ref.hubs, c.hub_id) : 'All hubs')],
    fields: [{ k: 'name', label: 'Community / area name', req: true }, { k: 'hub_id', label: 'Show on kiosk at', type: 'select', options: v => opts(A.ref.hubs, v, 'All hubs') }] });
  $('aout').insertAdjacentHTML('afterbegin', '<div class="note" style="margin-bottom:12px">These appear as quick-tap options on the kiosk. Visitors can always type a different area.</div>');
}

async function aSettings() {
  const s = A.ref.org.settings || {}; const rf = s.reg_fields || {}; const fq = s.feedback || {};
  const sa = role() === 'super_admin';
  const tog = (id, on, label) => `<label><input type="checkbox" id="${id}" ${on !== false ? 'checked' : ''} ${sa ? '' : 'disabled'}> ${label}</label>`;
  $('aout').innerHTML = `<div class="grid g2">
    <div class="card"><h3>Organisation</h3><div class="fld">
      ${fld('Organisation name', `<input class="i" id="s_name" value="${esc(A.ref.org.name)}" ${sa ? '' : 'disabled'}>`)}
      ${fld('Kiosk idle reset (seconds)', `<input class="i" id="s_idle" type="number" min="30" max="600" value="${esc(s.kiosk_idle_seconds || 90)}" ${sa ? '' : 'disabled'}>`)}</div>
      <label class="lb">Registration fields on the kiosk</label><div class="checks">${tog('rf_age', rf.age_group, 'Age group')}${tog('rf_gender', rf.gender, 'Gender')}${tog('rf_comm', rf.community, 'Community')}${tog('rf_email', rf.email, 'Email address')}</div>
      <div class="faint" style="font-size:12.5px;margin-top:6px">Name and mobile number are always required — they identify returning visitors.</div>
      <label class="lb">Feedback questions</label><div class="checks">${tog('fq_assisted', fq.assisted, '1. Were you assisted?')}${tog('fq_rating', fq.rating, '2. Rating 1–5')}${tog('fq_staff', fq.staff_helpful, '3. Staff helpful?')}${tog('fq_again', fq.visit_again, '4. Visit again?')}${tog('fq_imp', fq.improve, '5. What to improve')}${tog('fq_needs', fq.additional_needs, '6. Additional needs')}</div></div>
    <div class="card"><h3>POPIA</h3><div class="fld">
      ${fld('Privacy notice shown before registration', `<textarea class="i" id="s_notice" style="min-height:170px" ${sa ? '' : 'disabled'}>${esc(s.privacy_notice || '')}</textarea>`)}
      <div class="faint" style="font-size:12.5px;margin-top:6px">Each kiosk fills in its own details: <code>{hub}</code> Hub name · <code>{town}</code> Hub town · <code>{organisation}</code> organisation name · <code>{retention}</code> retention period.</div>
      <label class="lb">Preview for <select class="i" id="s_prevhub" style="padding:3px 6px;font-size:12.5px">${opts(A.ref.hubs, (A.ref.hubs[0] || {}).id)}</select></label>
      <div class="note" id="s_preview" style="line-height:1.55"></div>
      <div class="grid g2" style="gap:0 14px">${fld('Consent version', `<input class="i" id="s_cv" value="${esc(s.consent_version || 'v1')}" ${sa ? '' : 'disabled'}>`)}
      ${fld('Retention period (months after last visit)', `<input class="i" id="s_ret" type="number" min="6" value="${esc(s.retention_months || 36)}" ${sa ? '' : 'disabled'}>`)}</div></div>
      <div class="faint" style="font-size:12.5px;margin-top:6px">Change the consent version whenever you change the notice. Each visitor's consent is recorded with the version they agreed to.</div>
      ${sa ? `<div class="row" style="margin-top:14px"><button class="btn danger" id="runRet">Apply retention now</button><span class="faint" style="font-size:12.5px">Anonymises visitors whose last visit is older than the retention period.</span></div>` : ''}</div>
  </div>
  ${sa ? '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="saveS">Save settings</button></div>' : '<div class="note" style="margin-top:12px">Only a Super Administrator can change these settings.</div>'}`;
  const preview = () => {
    const h = byId(A.ref.hubs, $('s_prevhub').value) || {}; const months = Number($('s_ret').value) || 36;
    const ret = months % 12 === 0 ? (months / 12) + (months === 12 ? ' year' : ' years') : months + ' months';
    $('s_preview').textContent = ($('s_notice').value || '').replace(/\{hub\}/gi, h.name || 'this Hub').replace(/\{town\}/gi, h.town || h.name || 'your area')
      .replace(/\{organisation\}|\{organization\}/gi, $('s_name').value || A.ref.org.name).replace(/\{retention\}/gi, ret);
  };
  ['s_notice', 's_ret', 's_name'].forEach(id => $(id).addEventListener('input', preview)); $('s_prevhub').onchange = preview; preview();
  if (!sa) return;
  $('saveS').onclick = async () => {
    const ns = Object.assign({}, s, { kiosk_idle_seconds: Number($('s_idle').value) || 90, privacy_notice: $('s_notice').value.trim(), consent_version: $('s_cv').value.trim() || 'v1', retention_months: Number($('s_ret').value) || 36,
      reg_fields: { age_group: $('rf_age').checked, gender: $('rf_gender').checked, community: $('rf_comm').checked, email: $('rf_email').checked },
      feedback: { assisted: $('fq_assisted').checked, rating: $('fq_rating').checked, staff_helpful: $('fq_staff').checked, visit_again: $('fq_again').checked, improve: $('fq_imp').checked, additional_needs: $('fq_needs').checked } });
    try { await q(sb.from('organisations').update({ name: $('s_name').value.trim(), settings: ns }).eq('id', A.m.org_id)); toast('Settings saved'); await reload(); } catch (e) { fail(e); }
  };
  $('runRet').onclick = async () => {
    if (!await confirmDlg('Apply retention?', `Visitors whose last visit was more than ${s.retention_months || 36} months ago will be permanently anonymised.`, 'Apply retention')) return;
    try { const n = await q(sb.rpc('apply_retention', { p_org: A.m.org_id })); toast(n + ' visitor record(s) anonymised'); } catch (e) { fail(e); }
  };
}

async function aAudit() {
  const ent = $('aud_ent') ? $('aud_ent').value : '';
  let qq = sb.from('audit_log').select('*').eq('org_id', A.m.org_id).order('created_at', { ascending: false }).limit(300);
  if (ent) qq = qq.eq('entity', ent);
  const rows = await q(qq);
  const describe = r => { const d = r.details || {}; const keys = Object.keys(d).filter(k => !['id', 'org_id', 'created_at', 'feedback_token', 'updated_by'].includes(k)); return keys.slice(0, 6).map(k => `${k}: ${typeof d[k] === 'object' ? JSON.stringify(d[k]) : d[k]}`).join(' · '); };
  $('aout').innerHTML = `<div class="filters"><span class="lbl">Show</span><select class="i" id="aud_ent">${sopts(['visitors', 'visits', 'visit_services', 'members', 'hubs', 'programmes', 'donors', 'funding_allocations', 'service_categories', 'organisations', 'kiosk_link'], ent, 'All activity')}</select>
    <span class="faint" style="font-size:12.5px">Latest 300 entries. Visitor names and contact details are never written to the log.</span></div>
    ${tbl(['When', 'Who', 'Action', 'Record', 'Details'], rows.map(r => `<tr><td style="white-space:nowrap">${fmtDT(r.created_at)}</td><td>${esc(r.actor || '')}</td><td>${esc(r.action)}</td><td>${esc(r.entity.replace(/_/g, ' '))}</td><td class="faint" style="font-size:12.5px;max-width:520px">${esc(describe(r))}</td></tr>`), 'No activity recorded yet.')}`;
  $('aud_ent').onchange = () => aAudit().catch(fail);
}

boot();
</script>
</body>
</html>
