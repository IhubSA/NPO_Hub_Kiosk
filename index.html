<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NPO Community Hub — Staff & Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand:#0f766e; --brand-2:#115e59; --brand-soft:#e6f4f2; --side:#0d2624; --ink:#14201f; --muted:#5b6b69; --faint:#8a9896;
    --line:#e3e9e8; --bg:#f5f7f6; --card:#ffffff; --danger:#b42318; --warn:#b54708; --ok:#067647;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#eef1f0;
    --st-awaiting:#fab219; --st-progress:#2a78d6; --st-completed:#0ca30c; --st-referred:#6250d6; --st-follow:#ec835a; --st-unable:#d03b3b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; }
  a { color:var(--brand); }
  button { font:inherit; }
  .hidden { display:none !important; }

  /* auth */
  .auth { min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr; }
  .auth .art { background:linear-gradient(160deg,#0d2624,#0f766e 70%,#14b8a6); color:#fff; padding:56px; display:flex; flex-direction:column; justify-content:space-between; }
  .auth .art h1 { font-size:40px; line-height:1.1; margin:0 0 16px; letter-spacing:-.02em; max-width:520px; }
  .auth .art p { font-size:17px; opacity:.85; max-width:480px; line-height:1.55; }
  .auth .art ul { list-style:none; padding:0; margin:28px 0 0; display:grid; gap:10px; font-size:15px; opacity:.92; }
  .auth .art li::before { content:'✓  '; font-weight:800; }
  .auth .form { display:flex; align-items:center; justify-content:center; padding:40px; }
  .auth .box { width:100%; max-width:380px; }
  .auth h2 { margin:0 0 6px; font-size:26px; }
  .muted { color:var(--muted); }
  .faint { color:var(--faint); }
  @media (max-width:860px){ .auth{grid-template-columns:1fr} .auth .art{display:none} }

  /* layout */
  .shell { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  aside.side { background:var(--side); color:#cfe0de; padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
  .brandrow { display:flex; gap:10px; align-items:center; padding:6px 10px 18px; }
  .brandrow .lg { width:36px; height:36px; border-radius:10px; background:#14b8a6; color:#04201d; display:grid; place-items:center; font-weight:800; }
  .brandrow b { color:#fff; display:block; font-size:15px; }
  .brandrow span { font-size:12px; opacity:.7; }
  .nav { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:#cfe0de; cursor:pointer; border:0; background:none; text-align:left; font-weight:600; width:100%; }
  .nav:hover { background:rgba(255,255,255,.06); }
  .nav.on { background:rgba(20,184,166,.18); color:#fff; }
  .nav .ic { width:20px; text-align:center; }
  .nav .ct { margin-left:auto; background:#fab219; color:#3b2a00; font-size:12px; border-radius:999px; padding:1px 8px; font-weight:700; }
  .side .foot { margin-top:auto; font-size:12px; padding:10px; opacity:.75; line-height:1.5; }
  .side .foot button { background:none; border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; margin-top:8px; }
  .content { min-width:0; }
  .topbar { display:flex; align-items:center; gap:14px; padding:16px 28px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  .topbar h1 { margin:0; font-size:20px; }
  .topbar .sp { flex:1; }
  .page { padding:24px 28px 60px; max-width:1400px; }
  @media (max-width:900px){ .shell{grid-template-columns:1fr} aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap} .side .foot,.brandrow span{display:none} .page{padding:16px} }

  /* components */
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card .sub { font-size:12.5px; color:var(--muted); margin-bottom:12px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .kpis { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .kpi .l { font-size:12.5px; color:var(--muted); font-weight:600; }
  .kpi .v { font-size:28px; font-weight:800; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .h { font-size:12px; color:var(--faint); margin-top:2px; }
  @media (max-width:1100px){ .g2,.g3{grid-template-columns:1fr} }
  .btn { border:0; border-radius:10px; padding:9px 14px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--brand-2); }
  .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn.sec:hover { background:#f0f4f3; }
  .btn.danger { background:#fff; color:var(--danger); border:1px solid #f3c7c3; }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input.i, select.i, textarea.i { font:inherit; border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; color:var(--ink); min-width:0; }
  input.i:focus, select.i:focus, textarea.i:focus { outline:2px solid var(--brand-soft); border-color:var(--brand); }
  textarea.i { width:100%; min-height:72px; resize:vertical; }
  label.lb { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:12px 0 5px; }
  .fld input.i, .fld select.i, .fld textarea.i { width:100%; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:999px; cursor:pointer; font-weight:600; color:var(--muted); }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tab .n { margin-left:6px; font-size:12px; opacity:.8; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th { text-align:left; font-size:12px; color:var(--muted); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line); background:#fafcfb; position:sticky; top:0; }
  table.t td { padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:top; }
  table.t tr.click { cursor:pointer; }
  table.t tr.click:hover td { background:#f7faf9; }
  table.t td.n, table.t th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:#f0f3f2; color:var(--ink); margin:2px 4px 2px 0; }
  .chip .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .badge { font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--brand-soft); color:var(--brand); }
  .badge.new { background:#e8f1fd; color:#1c5cab; }
  .badge.minor { background:#fdf0e8; color:#9a3e12; }
  .badge.grey { background:#f0f3f2; color:var(--muted); }
  .qgrid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .qcard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; gap:14px; transition:border-color .15s, box-shadow .15s; }
  .qcard:hover { border-color:#bcd3d0; box-shadow:0 6px 18px -12px rgba(0,0,0,.25); }
  .qcard .tk { width:54px; height:54px; border-radius:12px; background:var(--brand-soft); color:var(--brand); font-weight:800; font-size:20px; display:grid; place-items:center; flex:none; }
  .qcard .nm { font-weight:700; font-size:15.5px; }
  .qcard.done { opacity:.75; }
  .qcard.done .tk { background:#e7f6ec; color:#067647; }
  .qsec { margin-bottom:22px; }
  .qsec h3 { margin:0 0 4px; font-size:15px; }
  .qsec .sub { font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .linkbtn { background:none; border:0; padding:4px 0; color:var(--brand); font-weight:700; cursor:pointer; font-size:14px; }
  .recvis { display:flex; gap:12px; align-items:center; margin-top:12px; }
  .recvis .tk { width:46px; height:46px; border-radius:12px; background:var(--brand-soft); color:var(--brand); font-weight:800; display:grid; place-items:center; flex:none; }
  .outcomes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .oc { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 6px; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; gap:6px; align-items:center; justify-content:center; color:var(--ink); }
  .oc span { font-size:15px; }
  .oc.on { color:#fff; border-color:transparent; }
  .oc.on.completed { background:#067647; } .oc.on.referred { background:#6250d6; } .oc.on.follow_up { background:#c4541f; } .oc.on.unable { background:#b42318; }
  .svcline { display:grid; grid-template-columns:150px 1fr; gap:10px; font-size:14px; align-items:start; }
  .addchips { display:flex; flex-wrap:wrap; gap:6px; }
  .addchip { border:1.5px dashed #c3d3d0; background:#fafcfb; border-radius:999px; padding:6px 12px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink); }
  .addchip:hover { border-color:var(--brand); color:var(--brand); }
  @media (max-width:700px){ .outcomes{grid-template-columns:repeat(2,1fr)} }
  .qcard .meta { font-size:12.5px; color:var(--muted); margin:2px 0 6px; }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); background:#fff; border:1px dashed var(--line); border-radius:14px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:16px; }
  .filters select.i, .filters input.i { padding:7px 9px; font-size:13.5px; }
  .filters .lbl { font-size:12px; color:var(--muted); font-weight:700; }
  .chartbox { position:relative; height:260px; }
  .chartbox.tall { height:320px; }
  .note { font-size:12.5px; color:var(--muted); background:#fafcfb; border:1px solid var(--line); border-radius:10px; padding:10px 12px; line-height:1.5; }
  .note.warn { background:#fff8eb; border-color:#f7dfae; color:#7a4a00; }

  /* drawer + modal */
  .scrim { position:fixed; inset:0; background:rgba(13,38,36,.42); z-index:40; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(720px,100%); background:var(--bg); z-index:41; overflow:auto; box-shadow:-20px 0 60px -30px rgba(0,0,0,.4); }
  .drawer header { background:#fff; border-bottom:1px solid var(--line); padding:18px 22px; position:sticky; top:0; z-index:2; display:flex; gap:14px; align-items:flex-start; }
  .drawer .body { padding:18px 22px 60px; display:grid; gap:14px; }
  .x { margin-left:auto; border:0; background:#f0f3f2; width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:18px; flex:none; }
  .modal { position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px; }
  .modal .mc { background:#fff; border-radius:16px; width:min(640px,100%); max-height:90vh; overflow:auto; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); }
  .modal .mh { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:#fff; z-index:1; }
  .modal .mh h3 { margin:0; font-size:17px; }
  .modal .mb { padding:6px 20px 18px; }
  .modal .mf { padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; position:sticky; bottom:0; background:#fff; }
  .svc { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .svc .hd { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .svc .two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .timeline { display:grid; gap:10px; }
  .tl { display:grid; grid-template-columns:96px 1fr; gap:10px; font-size:13.5px; }
  .tl .d { color:var(--muted); font-weight:600; }
  .toastwrap { position:fixed; bottom:20px; right:20px; z-index:80; display:grid; gap:8px; }
  .toast { background:var(--ink); color:#fff; padding:12px 16px; border-radius:12px; font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); max-width:360px; }
  .toast.err { background:var(--danger); }
  .checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; }
  .checks label { display:flex; gap:8px; align-items:center; font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .spin { width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brand); animation:sp 1s linear infinite; margin:40px auto; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .report { background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; }
  .report h2 { margin:0; font-size:22px; }
  .report .period { color:var(--muted); margin:4px 0 16px; }
  .report .summary p { line-height:1.6; margin:0 0 8px; }
  .report h4 { margin:22px 0 8px; font-size:14px; }
  .logoslot { width:76px; height:76px; border-radius:18px; border:2px dashed var(--line); background:#fafcfb; display:grid; place-items:center; overflow:hidden; flex:none; }
  .logoslot img { width:100%; height:100%; object-fit:contain; padding:8%; background:#fff; }
  .logoslot span { font-weight:800; font-size:24px; color:var(--brand); }
  .logoslot.sm { width:44px; height:44px; border-radius:12px; border-style:solid; border-width:2px; }
  .logoslot.sm span { font-size:15px; }
  .legend { display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
</style>
</head>
<body>
<div id="root"><div class="spin"></div></div>
<div class="toastwrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* =====================================================================
   NPO Community Hub — staff, management & donor app
   ===================================================================== */
const CFG = window.NPO_HUB_CONFIG;
const sb = supabase.createClient(CFG.url, CFG.key, { db: { schema: CFG.schema }, auth: { storageKey: 'npohub-staff-auth', persistSession: true } });

const ROLE_LABEL = { super_admin: 'Super Administrator', management: 'Management', hub_manager: 'Hub Manager', hub_staff: 'Hub Staff', programme_manager: 'Programme Manager', donor_viewer: 'Donor Viewer' };
const STATUS = {
  awaiting:    { label: 'Awaiting Assistance', c: 'var(--st-awaiting)' },
  in_progress: { label: 'In Progress', c: 'var(--st-progress)' },
  completed:   { label: 'Service Completed', c: 'var(--st-completed)' },
  referred:    { label: 'Referred to External Organisation', c: 'var(--st-referred)' },
  follow_up:   { label: 'Follow-up Required', c: 'var(--st-follow)' },
  unable:      { label: 'Unable to Assist', c: 'var(--st-unable)' }
};
const VISIT_STATUS = { awaiting: 'Waiting', in_progress: 'In progress', follow_up: 'Follow-up', closed: 'Closed' };
const AGE_GROUPS = ['Under 18', '18-24', '25-34', '35-44', '45-54', '55-64', '65+'];
const GENDERS = ['Female', 'Male', 'Non-binary', 'Prefer not to say'];
const PROVINCES = ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'North West', 'Northern Cape', 'Western Cape'];
const STAFF = ['super_admin', 'management', 'hub_manager', 'hub_staff', 'programme_manager'];
const MANAGERS = ['super_admin', 'management'];
const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];

const A = { session: null, memberships: [], m: null, ref: {}, view: null, charts: [], poll: null, seen: new Set(), sound: false };

/* ---------- utilities ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-ZA');
const fmtR = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', { maximumFractionDigits: 0 });
const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : null;
const fmtPct = v => v == null ? '–' : v + '%';
const tz = 'Africa/Johannesburg';
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric', timeZone: tz }) : '';
const fmtTime = d => d ? new Date(d).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', timeZone: tz }) : '';
const fmtDT = d => d ? fmtDate(d) + ' ' + fmtTime(d) : '';
const isoDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: tz });
const today = () => isoDay(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const monthLabel = ym => { const [y, m] = ym.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-ZA', { month: 'short', year: '2-digit' }); };
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.floor(m / 60); if (h < 24) return h + 'h ' + (m % 60) + 'm ago'; return fmtDate(d); };
const uniq = arr => [...new Set(arr)];
const groupBy = (arr, fn) => arr.reduce((acc, x) => { const k = fn(x); (acc[k] = acc[k] || []).push(x); return acc; }, {});
const role = () => A.m && A.m.role;
const can = roles => roles.includes(role());
const byId = (list, id) => (list || []).find(x => x.id === id);
const nameOf = (list, id, fb = '—') => (byId(list, id) || {}).name || fb;
const memberName = id => (byId(A.ref.members, id) || {}).full_name || '—';
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3500); }
function fail(e) { console.error(e); toast((e && (e.message || e.error_description)) || 'Something went wrong', true); }
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function all(build) { const out = []; let from = 0; for (;;) { const d = await q(build().range(from, from + 999)); out.push(...d); if (d.length < 1000) break; from += 1000; } return out; }
const opts = (list, sel, blank, label = x => x.name, val = x => x.id) => (blank != null ? `<option value="">${esc(blank)}</option>` : '') + list.map(x => `<option value="${esc(val(x))}" ${String(val(x)) === String(sel) ? 'selected' : ''}>${esc(label(x))}</option>`).join('');
const sopts = (list, sel, blank) => opts(list.map(x => ({ id: x, name: x })), sel, blank);
const chip = (txt, color) => `<span class="chip">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(txt)}</span>`;
const statusChip = st => chip(STATUS[st] ? STATUS[st].label : st, STATUS[st] && STATUS[st].c);
function killCharts() { A.charts.forEach(c => c.destroy()); A.charts = []; }

/* ---------- modal / drawer ---------- */
function modal(title, body, { save, saveLabel = 'Save', wide, danger } = {}) {
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="scrim"></div><div class="mc" style="position:relative;z-index:61;${wide ? 'width:min(900px,100%)' : ''}">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
    <div class="mb">${body}</div>
    <div class="mf"><button class="btn sec" data-close>Cancel</button>${save ? `<button class="btn ${danger ? 'danger' : ''}" data-save>${esc(saveLabel)}</button>` : ''}</div></div>`;
  document.body.appendChild(w);
  const close = () => w.remove();
  w.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  w.querySelector('.scrim').onclick = close;
  if (save) w.querySelector('[data-save]').onclick = async e => {
    e.target.disabled = true;
    try { const r = await save(w); if (r !== false) close(); } catch (err) { fail(err); } finally { e.target.disabled = false; }
  };
  return w;
}
function confirmDlg(title, text, label = 'Confirm') { return new Promise(res => { const m = modal(title, `<p>${esc(text)}</p>`, { save: () => res(true), saveLabel: label, danger: true }); m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => res(false))); }); }
function drawer(html) {
  closeDrawer();
  const s = document.createElement('div'); s.className = 'scrim'; s.id = 'dscrim'; s.onclick = closeDrawer;
  const d = document.createElement('div'); d.className = 'drawer'; d.id = 'drawer'; d.innerHTML = html;

}

let recovering = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { recovering = true; renderAuth('newpw'); return; }
  if (recovering) return;
  if (event === 'SIGNED_IN' && session) { A.session = session; startApp(); }
  if (event === 'SIGNED_OUT') { A.session = null; A.m = null; A.startedFor = null; renderAuth(); }
  if (event === 'TOKEN_REFRESHED') A.session = session;
});

async function boot() {
  const { data } = await sb.auth.getSession();
  if (recovering) return;
  if (data.session) { A.session = data.session; startApp(); } else renderAuth();
}

async function startApp(force) {
  const uid = A.session && A.session.user.id;
  if (!force && A.startedFor === uid) return;
  A.startedFor = uid;
  $('root').innerHTML = '<div class="spin"></div>';
  try {
    A.memberships = await q(sb.rpc('my_memberships'));
  } catch (e) {
    $('root').innerHTML = `<div class="page"><div class="card"><h3>Could not connect to the database</h3><p class="muted">${esc(e.message)}</p>
      <p class="muted">If this says the schema is not exposed, add <b>${esc(CFG.schema)}</b> under Supabase → Project Settings → Data API → Exposed schemas.</p>
      <button class="btn sec" onclick="sb.auth.signOut()">Sign out</button></div></div>`;
    return;
  }
  if (!A.memberships.length) {
    $('root').innerHTML = `<div class="auth" style="grid-template-columns:1fr"><div class="form"><div class="box">
      <h2>No access yet</h2><p class="muted">You're signed in as <b>${esc(A.session.user.email)}</b>, but this account hasn't been added to an organisation. Ask your administrator to add this email under <b>Admin → Users</b>, then sign in again.</p>
      <button class="btn sec" onclick="sb.auth.signOut()">Sign out</button></div></div></div>`;
    return;
  }
  const last = (() => { try { return localStorage.getItem('npohub.org'); } catch (e) { return null; } })();
  A.m = A.memberships.find(x => x.org_id === last) || A.memberships[0];
  await loadRef();
  renderShell();
  go(defaultView());
}

async function switchOrg(orgId) {
  A.m = A.memberships.find(x => x.org_id === orgId);
  try { localStorage.setItem('npohub.org', orgId); } catch (e) {}
  await loadRef(); renderShell(); go(defaultView());
}

async function loadRef() {
  const o = A.m.org_id;
  const [org, regions, hubs, cats, progs, comms, members] = await Promise.all([
    q(sb.from('organisations').select('*').eq('id', o).single()),
    q(sb.from('regions').select('*').eq('org_id', o).order('name')),
    q(sb.from('hubs').select('*').eq('org_id', o).order('name')),
    q(sb.from('service_categories').select('*').eq('org_id', o).order('sort_order')),
    q(sb.from('programmes').select('*').eq('org_id', o).order('name')),
    q(sb.from('communities').select('*').eq('org_id', o).order('name')),
    q(sb.from('members').select('*').eq('org_id', o).order('full_name'))
  ]);
  let donors = [], allocs = [], hubSvc = [];
  if (role() !== 'hub_staff') {
    donors = await q(sb.from('donors').select('*').eq('org_id', o).order('name'));
    allocs = await q(sb.from('funding_allocations').select('*').eq('org_id', o).order('start_date'));
  }
  hubSvc = await q(sb.from('hub_services').select('*').eq('org_id', o));
  A.ref = { org, regions, hubs, cats, progs, comms, members, donors, allocs, hubSvc };
}

function myHubs() {
  const hubs = A.ref.hubs.filter(h => h.active);
  if (can(MANAGERS)) return hubs;
  const ids = A.m.hub_ids || [];
  if (role() === 'programme_manager' && !ids.length) return hubs;
  return hubs.filter(h => ids.includes(h.id));
}

const VISIT_SELECT = 'id, org_id, hub_id, visitor_id, ticket_no, visited_at, is_first_visit, status, need_description, unmet_other, feedback_token, source, assigned_member_id, completed_at, ' +
  'visitor:visitors(id, full_name, mobile, email, community, age_group, gender, is_minor, guardian_consent, created_at, anonymised_at), ' +
  'visit_services(id, category_id, status, is_available, programme_id, assigned_member_id, service_provided, referral_org, resolved, follow_up_date, updated_at), feedback(id, rating, assisted, staff_helpful, visit_again, improve, additional_needs, created_at)';
const fbOf = v => Array.isArray(v.feedback) ? v.feedback[0] : v.feedback;

const QS = { hub: '', showDone: false };
const isPending = s => s.is_available && (s.status === 'awaiting' || s.status === 'in_progress');
const initialsOf = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
async function vQueue() {
  const hubs = myHubs();
  if (QS.hub && !hubs.find(h => h.id === QS.hub)) QS.hub = '';
  if (!QS.hub && hubs.length === 1) QS.hub = hubs[0].id;
  $('tools').innerHTML = `
    <select class="i" id="qhub">${opts(hubs, QS.hub, hubs.length > 1 ? 'All my hubs' : null)}</select>
    <label class="row" style="gap:6px;font-size:13px;color:var(--muted)"><input type="checkbox" id="qsound" ${A.sound ? 'checked' : ''}> Sound when someone signs in</label>
    <button class="btn" id="walkin">+ Add a visitor</button>`;
  $('qhub').onchange = e => { QS.hub = e.target.value; loadQueue(true); };
  $('qsound').onchange = e => { A.sound = e.target.checked; if (A.sound) beep(); };
  $('walkin').onclick = () => walkIn();
  A.seen = new Set();
  await loadQueue(true);
  A.poll = setInterval(() => loadQueue(false).catch(() => {}), 20000);
}

async function loadQueue(first) {
  const hubIds = QS.hub ? [QS.hub] : myHubs().map(h => h.id);
  if (!hubIds.length) { $('page').innerHTML = '<div class="empty">You are not assigned to any Hub yet. Ask your administrator to allocate you to a Hub.</div>'; return; }
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const startToday = new Date(today() + 'T00:00:00+02:00').toISOString();
  const rows = await q(sb.from('visits').select(VISIT_SELECT).eq('org_id', A.m.org_id).in('hub_id', hubIds)
    .gte('visited_at', since).order('visited_at', { ascending: false }).limit(500));
  const waiting = rows.filter(v => (v.visit_services || []).some(isPending));
  const waitToday = waiting.filter(v => v.visited_at >= startToday), waitEarlier = waiting.filter(v => v.visited_at < startToday);
  const doneToday = rows.filter(v => v.visited_at >= startToday && !(v.visit_services || []).some(isPending));
  const followUps = rows.filter(v => !(v.visit_services || []).some(isPending) && (v.visit_services || []).some(x => x.status === 'follow_up'));
  // new sign-ins
  const fresh = waiting.filter(v => !A.seen.has(v.id));
  waiting.forEach(v => A.seen.add(v.id));
  if (!first && fresh.length) { fresh.forEach(v => toast(`${(v.visitor || {}).full_name || 'A visitor'} has signed in at ${nameOf(A.ref.hubs, v.hub_id)}`)); if (A.sound) beep(); }
  const ct = $('qct'); if (ct) { ct.textContent = waiting.length; ct.classList.toggle('hidden', !waiting.length); }
  if (A.view !== 'queue') return;
  const section = (title, sub, list, kind) => `<div class="qsec"><h3>${title} <span class="faint" style="font-weight:600">${list.length}</span></h3>${sub ? `<div class="sub">${sub}</div>` : ''}
      <div class="qgrid">${list.map(v => qCard(v, kind)).join('')}</div></div>`;
  $('page').innerHTML = `
    <div class="note" style="margin-bottom:16px">Click a visitor's name to record the services you provided. Once saved, they move off this list.<span class="faint" style="float:right">Updates every 20 seconds</span></div>
    ${waitToday.length ? section('Signed in today', '', waitToday, 'wait') : `<div class="empty" style="margin-bottom:18px">Nobody is waiting right now. When someone signs in on the kiosk, their name appears here.</div>`}
    ${waitEarlier.length ? section('Still to record from earlier days', 'These visitors signed in on a previous day but their services were never recorded.', waitEarlier, 'wait') : ''}
    ${followUps.length ? section('Follow-ups', 'Recorded, but marked as needing a follow-up.', followUps, 'follow') : ''}
    <div class="qsec"><button class="linkbtn" id="toggleDone">${QS.showDone ? '▾' : '▸'} Recorded today (${doneToday.length})</button>
      ${QS.showDone ? (doneToday.length ? `<div class="qgrid" style="margin-top:10px">${doneToday.map(v => qCard(v, 'done')).join('')}</div>` : '<div class="faint" style="margin-top:8px">Nothing recorded yet today.</div>') : ''}</div>`;
  $('toggleDone').onclick = () => { QS.showDone = !QS.showDone; loadQueue(false); };
  document.querySelectorAll('.qcard').forEach(c => c.onclick = () => recordVisit(c.dataset.id));
}

function qCard(v, kind) {
  const vi = v.visitor || {};
  const svcs = (v.visit_services || []).filter(s => s.is_available);
  return `<div class="qcard ${kind === 'done' ? 'done' : ''}" data-id="${v.id}">
    <div class="tk">${kind === 'done' ? '✓' : esc(initialsOf(vi.full_name))}</div>
    <div style="min-width:0;flex:1">
      <div class="row" style="gap:6px"><span class="nm">${esc(vi.full_name)}</span>
        ${v.is_first_visit ? '<span class="badge new">First visit</span>' : '<span class="badge grey">Returning</span>'}
        ${vi.is_minor ? '<span class="badge minor">Under 18</span>' : ''}</div>
      <div class="meta">${esc(nameOf(A.ref.hubs, v.hub_id))} · signed in ${fmtTime(v.visited_at)}${v.visited_at < new Date(today() + 'T00:00:00+02:00').toISOString() ? ' on ' + fmtDate(v.visited_at) : ''}</div>
      <div>${svcs.map(s => chip(nameOf(A.ref.cats, s.category_id), kind === 'wait' && isPending(s) ? 'var(--st-awaiting)' : STATUS[s.status].c)).join('')}</div>
      ${v.need_description ? `<div class="faint" style="font-size:12.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">“${esc(v.need_description)}”</div>` : ''}
    </div></div>`;
}

/* ---------- record services (simple form for Community Liaison Officers) ---------- */
const OUTCOMES = [
  { k: 'completed', l: 'Provided', ic: '✓' },
  { k: 'referred', l: 'Referred', ic: '↗' },
  { k: 'follow_up', l: 'Follow-up needed', ic: '⟳' },
  { k: 'unable', l: "Couldn't help", ic: '✕' }
];
async function recordVisit(id, onSaved) {
  let v;
  try { v = await q(sb.from('visits').select(VISIT_SELECT).eq('id', id).single()); } catch (e) { return fail(e); }
  const vi = v.visitor || {};
  const first = (vi.full_name || '').split(' ')[0];
  const existing = (v.visit_services || []).filter(s => s.is_available);
  const unmet = (v.visit_services || []).filter(s => !s.is_available);
  const offered = A.ref.cats.filter(c => c.active && A.ref.hubSvc.some(h => h.hub_id === v.hub_id && h.category_id === c.id));
  // working state: one row per service
  const rows = existing.map(s => ({ id: s.id, category_id: s.category_id, outcome: isPending(s) ? 'completed' : s.status, provided: s.service_provided || '', referral: s.referral_org || '', follow: s.follow_up_date || '', programme_id: s.programme_id }));
  const draw = () => {
    const body = $('rec_body'); if (!body) return;
    body.innerHTML = rows.map((r, i) => `
      <div class="svc recrow">
        <div class="hd"><b>${esc((byId(A.ref.cats, r.category_id) || {}).icon || '')} ${esc(nameOf(A.ref.cats, r.category_id))}</b>${r.id ? '' : '<span class="badge">Added</span>'}
          ${r.id ? '' : `<button class="linkbtn" data-rm="${i}" style="margin-left:auto">Remove</button>`}</div>
        <div class="outcomes">${OUTCOMES.map(o => `<button type="button" class="oc ${r.outcome === o.k ? 'on ' + o.k : ''}" data-i="${i}" data-o="${o.k}"><span>${o.ic}</span>${o.l}</button>`).join('')}</div>
        ${r.outcome === 'referred' ? `<label class="lb">Referred to which organisation?</label><input class="i" style="width:100%" list="reforgs" data-f="referral" data-i="${i}" value="${esc(r.referral)}" placeholder="e.g. SEDA, SASSA, Home Affairs">` : ''}
        ${r.outcome === 'follow_up' ? `<label class="lb">Follow up on</label><input class="i" type="date" data-f="follow" data-i="${i}" value="${esc(r.follow)}">` : ''}
        <label class="lb">What did you do? <span class="faint" style="font-weight:500">(optional)</span></label>
        <input class="i" style="width:100%" data-f="provided" data-i="${i}" value="${esc(r.provided)}" placeholder="${r.outcome === 'unable' ? 'Why could we not help?' : 'e.g. Helped write and print a CV'}">
      </div>`).join('') || '<div class="faint">No services yet. Add the service you provided below.</div>';
    body.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { rows[+b.dataset.i].outcome = b.dataset.o; draw(); });
    body.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { rows[+el.dataset.i][el.dataset.f] = el.value; });
    body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); draw(); drawAdd(); });
  };
  const drawAdd = () => {
    const el = $('rec_add'); if (!el) return;
    const left = offered.filter(c => !rows.some(r => r.category_id === c.id));
    el.innerHTML = left.length ? left.map(c => `<button type="button" class="addchip" data-add="${c.id}">+ ${esc(c.icon || '')} ${esc(c.name)}</button>`).join('') : '<span class="faint">All services added.</span>';
    el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      const p = A.ref.progs.find(x => x.category_id === b.dataset.add && x.active);
      rows.push({ id: null, category_id: b.dataset.add, outcome: 'completed', provided: '', referral: '', follow: '', programme_id: p ? p.id : null });
      draw(); drawAdd();
    });
  };
  const w = modal(`Record services for ${vi.full_name || 'visitor'}`, `
    <div class="recvis">
      <div class="tk">${esc(initialsOf(vi.full_name))}</div>
      <div><div class="row" style="gap:6px"><b style="font-size:16px">${esc(vi.full_name)}</b>${v.is_first_visit ? '<span class="badge new">First visit</span>' : '<span class="badge grey">Returning</span>'}${vi.is_minor ? '<span class="badge minor">Under 18</span>' : ''}</div>
        <div class="muted" style="font-size:13px">${esc(vi.community || '')}${vi.age_group ? ' · ' + esc(vi.age_group) : ''} · ${esc(nameOf(A.ref.hubs, v.hub_id))} · signed in ${fmtTime(v.visited_at)}${v.visited_at < new Date(today() + 'T00:00:00+02:00').toISOString() ? ' on ' + fmtDate(v.visited_at) : ''}</div></div>
      <button class="linkbtn" id="rec_hist" style="margin-left:auto">Visit history</button>
    </div>
    ${v.need_description ? `<div class="note" style="margin-top:12px"><b>${esc(first)} said:</b> “${esc(v.need_description)}”</div>` : ''}
    ${unmet.length ? `<div class="note warn" style="margin-top:8px">Also asked for (not offered at this Hub — recorded as an unmet need): ${unmet.map(s => esc(nameOf(A.ref.cats, s.category_id))).join(', ')}</div>` : ''}
    <h4 style="margin:18px 0 8px">What help did ${esc(first)} get?</h4>
    <div id="rec_body" class="grid" style="gap:10px"></div>
    <label class="lb" style="margin-top:16px">Did you also help with something else?</label><div id="rec_add" class="addchips"></div>
    <label class="lb" style="margin-top:16px">Note <span class="faint" style="font-weight:500">(optional, only seen by staff)</span></label>
    <textarea class="i" id="rec_note" placeholder="Anything the team should know for next time"></textarea>
    <datalist id="reforgs">${['SEDA', 'SEFA', 'SASSA', 'NYDA', 'Department of Employment & Labour', 'Legal Aid SA', 'Local clinic', 'Home Affairs'].map(x => `<option value="${x}">`).join('')}</datalist>`,
  { wide: true, saveLabel: 'Save', save: async () => {
    if (!rows.length) { toast('Add at least one service you provided', true); return false; }
    const bad = rows.find(r => r.outcome === 'referred' && !r.referral.trim());
    if (bad) { toast(`Enter where ${nameOf(A.ref.cats, bad.category_id)} was referred to`, true); return false; }
    // services removed from the request list are not deleted — only newly added ones can be removed before saving
    for (const r of rows) {
      const upd = { status: r.outcome, service_provided: r.provided.trim() || null, referral_org: r.outcome === 'referred' ? r.referral.trim() : null,
                    follow_up_date: r.outcome === 'follow_up' ? (r.follow || null) : null, resolved: r.outcome === 'completed' || r.outcome === 'referred' ? true : r.outcome === 'unable' ? false : null,
                    assigned_member_id: A.m.member_id, updated_by: A.m.member_id };
      if (r.id) await q(sb.from('visit_services').update(upd).eq('id', r.id));
      else await q(sb.from('visit_services').insert(Object.assign({ org_id: v.org_id, visit_id: v.id, category_id: r.category_id, is_available: true, programme_id: r.programme_id }, upd)));
    }
    await q(sb.from('visits').update({ assigned_member_id: A.m.member_id }).eq('id', v.id));
    const note = $('rec_note').value.trim();
    if (note) await q(sb.from('visit_notes').insert({ org_id: v.org_id, visit_id: v.id, member_id: A.m.member_id, note }));
    if (A.view === 'queue') loadQueue(false).catch(() => {});
    if (onSaved) onSaved();
    if (!fbOf(v)) afterRecord(v); else toast(`Saved — ${first} has been removed from the list`);
  } });
  draw(); drawAdd();
  $('rec_hist').onclick = () => { w.remove(); openVisit(v.id); };
  if (onSaved) $('rec_hist').classList.add('hidden');
}

function afterRecord(v) {
  const vi = v.visitor || {}; const first = (vi.full_name || 'the visitor').split(' ')[0];
  const fbUrl = new URL('kiosk.html?fb=' + v.feedback_token, location.href).href;

      <div style="font-size:42px">✅</div>
      <p style="font-size:16px;margin:8px 0 4px"><b>${esc(first)}'s</b> services are recorded and they have been removed from the list.</p>

      <div class="row" style="justify-content:center"><button class="btn" id="fbHere">Hand over this device for feedback</button></div>
      <p class="faint" style="font-size:12.5px;margin-top:12px">Or ${esc(first)} can tap <b>Give feedback</b> on the kiosk and enter their mobile number.</p></div>`);

function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); const g = c.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.frequency.value = 1175; }, 150); setTimeout(() => { o.stop(); c.close(); }, 320); } catch (e) {} }

/* ---------- visit drawer ---------- */
async function openVisit(id) {
  const d = drawer('<div class="spin"></div>');
  try {
    const v = await q(sb.from('visits').select(VISIT_SELECT).eq('id', id).single());
    const [notes, history] = await Promise.all([
      q(sb.from('visit_notes').select('*').eq('visit_id', id).order('created_at')),

    ]);
    renderVisit(d, v, notes, history);
  } catch (e) { fail(e); closeDrawer(); }
}

  const outcome = st => ({ completed: 'Provided', referred: 'Referred', follow_up: 'Follow-up needed', unable: "Couldn't help", awaiting: 'Not recorded yet', in_progress: 'Not recorded yet' }[st] || st);
  const outcomeColour = st => isPending({ status: st, is_available: true }) ? 'var(--st-awaiting)' : STATUS[st].c;
  d.innerHTML = `
  <header>
    <div class="recvis" style="margin:0"><div class="tk">${esc(initialsOf(vi.full_name))}</div></div>
    <div style="min-width:0">
      <div class="row" style="gap:6px"><h2 style="margin:0;font-size:20px">${esc(vi.full_name)}</h2>

    <div class="card"><div class="grid g3" style="gap:8px 16px;font-size:14px">
      <div><div class="faint" style="font-size:12px">Mobile</div>${esc(vi.mobile)}</div>
      <div><div class="faint" style="font-size:12px">Email</div>${esc(vi.email || '—')}</div>
      <div><div class="faint" style="font-size:12px">Community</div>${esc(vi.community || '—')}</div>
      <div><div class="faint" style="font-size:12px">Age group</div>${esc(vi.age_group || '—')}</div>
      <div><div class="faint" style="font-size:12px">Gender</div>${esc(vi.gender || '—')}</div>

    </div>

    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Services</h3>
        ${editable ? `<button class="btn sm ${pending ? '' : 'sec'}" id="recSvc">${pending ? 'Record services' : 'Edit services'}</button>` : ''}</div>
      <div class="timeline">${svcs.map(s => `<div class="svcline">
          <div>${chip(outcome(s.status), outcomeColour(s.status))}</div>
          <div><b>${esc((byId(A.ref.cats, s.category_id) || {}).icon || '')} ${esc(nameOf(A.ref.cats, s.category_id))}</b>${s.referral_org ? ' → ' + esc(s.referral_org) : ''}${s.follow_up_date ? ' · follow up ' + fmtDate(s.follow_up_date) : ''}
            ${s.service_provided ? `<div class="muted" style="font-size:13px">${esc(s.service_provided)}</div>` : ''}
            ${s.assigned_member_id && !isPending(s) ? `<div class="faint" style="font-size:12px">by ${esc(memberName(s.assigned_member_id))}</div>` : ''}</div></div>`).join('') || '<div class="faint">No services recorded.</div>'}</div>
    </div>

    <div class="card"><h3>Visitor feedback</h3>
      ${fbk ? `<div class="row" style="margin-top:8px"><span style="font-size:26px;font-weight:800">${fbk.rating || '–'}/5</span>
        <span class="muted">Assisted: ${esc(fbk.assisted || '–')} · Staff helpful: ${esc(fbk.staff_helpful || '–')} · Would return: ${esc(fbk.visit_again || '–')}</span></div>
        ${fbk.improve ? `<div class="note" style="margin-top:8px">Improve: ${esc(fbk.improve)}</div>` : ''}
        ${fbk.additional_needs ? `<div class="note" style="margin-top:8px">Other needs: ${esc(fbk.additional_needs)}</div>` : ''}`

        <div>${(h.visit_services || []).map(s => chip(nameOf(A.ref.cats, s.category_id) + (s.referral_org ? ' → ' + s.referral_org : ''), outcomeColour(s.status))).join('')}</div></div></div>`).join('')}</div>
    </div>
  </div>`;

  const refresh = () => openVisit(v.id);
  if ($('recSvc')) $('recSvc').onclick = () => recordVisit(v.id, refresh);
  d.querySelectorAll('[data-visit]').forEach(a => a.onclick = e => { e.preventDefault(); openVisit(a.dataset.visit); });
  if ($('addnote')) $('addnote').onclick = async () => {

  };

  if (!hubs.length) return toast('You need to be assigned to a Hub to add visitors', true);
  const st = { services: new Set() };
  const w = modal('Add a visitor', `
    <div class="note" style="margin-top:12px">Use this when someone can't use the tablet. Read the privacy notice to them and record their consent.</div>
    <div class="fld grid g2" style="gap:0 14px">
      <div><label class="lb">Hub</label><select class="i" id="w_hub">${opts(hubs, QS.hub || hubs[0].id)}</select></div>
      <div><label class="lb">Mobile number</label><input class="i" id="w_mobile" inputmode="tel" placeholder="082 123 4567"></div>
      <div><label class="lb">Name and surname</label><input class="i" id="w_name"></div>

    </div>
    <label class="lb">Services required</label><div class="checks" id="w_svcs"></div>
    <label class="lb">What assistance do they need? (optional)</label><textarea class="i" id="w_need"></textarea>
    <label class="row" style="margin-top:12px;gap:8px"><input type="checkbox" id="w_consent"> The visitor heard the privacy notice and gave consent</label>
    <label class="row hidden" style="margin-top:8px;gap:8px" id="w_gwrap"><input type="checkbox" id="w_guardian"> A parent/guardian is present and gave consent (under 18)</label>`,
    { saveLabel: 'Add visitor', save: async () => {
      const hub = $('w_hub').value;
      const avail = A.ref.cats.filter(c => c.active && A.ref.hubSvc.some(h => h.hub_id === hub && h.category_id === c.id)).map(c => c.id);
      const chosen = [...w.querySelectorAll('#w_svcs input:checked')].map(i => i.value);
      const p = { full_name: $('w_name').value, mobile: $('w_mobile').value, email: $('w_email').value, age_group: $('w_age').value, gender: $('w_gender').value,
                  community: $('w_comm').value, consent: $('w_consent').checked, guardian_consent: $('w_guardian').checked, need_description: $('w_need').value,
                  services: chosen.filter(c => avail.includes(c)), unmet: chosen.filter(c => !avail.includes(c)) };
      const r = await q(sb.rpc('staff_register', { p_hub: hub, p }));
      toast(`${p.full_name.trim().split(' ')[0] || 'Visitor'} added${r.returning ? ' (returning visitor)' : ''}`);
      if (A.view === 'queue') loadQueue(false);
    } });
  const drawSvcs = () => {
    const hub = $('w_hub').value;
    $('w_svcs').innerHTML = A.ref.cats.filter(c => c.active).map(c => {
      const av = A.ref.hubSvc.some(h => h.hub_id === hub && h.category_id === c.id);
      return `<label><input type="checkbox" value="${c.id}"> ${esc(c.icon || '')} ${esc(c.name)}${av ? '' : ' <span class="faint">(unmet)</span>'}</label>`;
    }).join('');
  };
  drawSvcs(); $('w_hub').onchange = drawSvcs;
  $('w_age').onchange = e => $('w_gwrap').classList.toggle('hidden', e.target.value !== 'Under 18');
}

   DATA FOR DASHBOARDS & REPORTS
   ===================================================================== */
const FACT_CACHE = {};
async function facts(from, to) {
  const key = from + '|' + to;
  if (FACT_CACHE[key] && Date.now() - FACT_CACHE[key].t < 120000) return FACT_CACHE[key].rows;
  const start = new Date(from + 'T00:00:00+02:00').toISOString(), end = new Date(addDays(to, 1) + 'T00:00:00+02:00').toISOString();
  const rows = await all(() => sb.from('v_service_facts').select('*').eq('org_id', A.m.org_id).gte('visited_at', start).lt('visited_at', end).order('visited_at'));
  FACT_CACHE[key] = { t: Date.now(), rows };
  return rows;
}

function metrics(rows) {
  const visits = groupBy(rows, r => r.visit_id);
  const visitList = Object.values(visits).map(g => g[0]);
  const byVisitor = groupBy(visitList, r => r.visitor_id);
  const ratings = visitList.filter(v => v.rating != null).map(v => v.rating);
  const avail = rows.filter(r => r.is_available);
  const actioned = avail.filter(r => r.status !== 'awaiting' && r.status !== 'in_progress');
  return {
    visits: visitList.length,
    unique: Object.keys(byVisitor).length,
    newBen: uniq(visitList.filter(v => v.is_first_visit).map(v => v.visitor_id)).length,
    repeatVisitors: Object.values(byVisitor).filter(g => g.length > 1 || g.some(v => !v.is_first_visit)).length,
    returningVisits: visitList.filter(v => !v.is_first_visit).length,
    requested: rows.length,
    delivered: rows.filter(r => r.status === 'completed' || r.status === 'referred').length,
    completed: rows.filter(r => r.status === 'completed').length,
    outstanding: avail.filter(r => ['awaiting', 'in_progress', 'follow_up'].includes(r.status)).length,
    referrals: rows.filter(r => r.status === 'referred').length,
    unmet: rows.filter(r => !r.is_available).length,
    avgRating: ratings.length ? Math.round(100 * ratings.reduce((a, b) => a + b, 0) / ratings.length) / 100 : null,
    feedbackN: ratings.length,
    resolution: pct(actioned.filter(r => r.status === 'completed' || r.status === 'referred').length, actioned.length),
    communities: uniq(visitList.map(v => v.community).filter(Boolean)).length,
    hubs: uniq(visitList.map(v => v.hub_id)).length
  };
}
const countBy = (rows, fn, distinctFn) => {
  const g = groupBy(rows, fn);
  return Object.entries(g).map(([k, v]) => [k, distinctFn ? uniq(v.map(distinctFn)).length : v.length]).sort((a, b) => b[1] - a[1]);
};
const monthsBetween = (from, to) => { const out = []; let d = new Date(from.slice(0, 7) + '-01T12:00:00'); const e = new Date(to.slice(0, 7) + '-01T12:00:00'); while (d <= e) { out.push(d.toISOString().slice(0, 7)); d.setMonth(d.getMonth() + 1); } return out; };

/* ---------- charts (single axis, thin marks, fixed series order) ---------- */
Chart.defaults.font.family = 'Figtree, system-ui, sans-serif';
Chart.defaults.font.size = 12;
Chart.defaults.color = '#5b6b69';
function chart(canvasId, type, labels, datasets, extra = {}) {
  const el = $(canvasId); if (!el) return null;
  const horizontal = extra.horizontal;
  const c = new Chart(el, {
    type,
    data: { labels, datasets: datasets.map((d, i) => { const dt = d.type || type; return Object.assign({
      backgroundColor: SERIES[i], borderColor: dt === 'line' ? SERIES[i] : '#ffffff',
      borderWidth: dt === 'line' ? 2 : 0, borderRadius: dt === 'bar' ? 4 : 0, borderSkipped: 'start',
      maxBarThickness: 26, pointRadius: dt === 'line' ? 3 : 0, pointHoverRadius: 6, pointBackgroundColor: SERIES[i], pointBorderColor: '#ffffff', pointBorderWidth: 2, tension: .25, fill: false
    }, d); }) },
    options: Object.assign({
      responsive: true, maintainAspectRatio: false, indexAxis: horizontal ? 'y' : 'x',
      interaction: { mode: type === 'line' ? 'index' : 'nearest', intersect: type !== 'line' },
      plugins: { legend: { display: datasets.length > 1, position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3 } },
                 tooltip: { backgroundColor: '#14201f', padding: 10, cornerRadius: 8, titleFont: { weight: '700' } } },
      scales: {
        x: { grid: { display: !!horizontal, color: '#eef1f0' }, border: { display: false }, ticks: { precision: 0 }, stacked: !!extra.stacked, beginAtZero: true },
        y: { grid: { display: !horizontal, color: '#eef1f0' }, border: { display: false }, ticks: { precision: 0 }, stacked: !!extra.stacked, beginAtZero: true, max: extra.max }
      }
    }, extra.options || {})
  });
  A.charts.push(c);
  return c;
}

function applyFilters(rows, F) {
  const hubIds = myHubs().map(h => h.id);
  return rows.filter(r => hubIds.includes(r.hub_id)
    && (!F.hub || r.hub_id === F.hub) && (!F.region || r.region_id === F.region)
    && (!F.town || (byId(A.ref.hubs, r.hub_id) || {}).town === F.town)
    && (!F.prog || r.programme_id === F.prog) && (!F.cat || r.category_id === F.cat)
    && (!F.gender || r.gender === F.gender) && (!F.age || r.age_group === F.age)
    && (!F.vtype || (F.vtype === 'first' ? r.is_first_visit : !r.is_first_visit)));
}

      <tbody>${t.rows.map(r => `<tr>${r.map((v, i) => `<td class="${i && t.num !== false ? 'n' : ''}">${esc(v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${t.cols.length}" class="faint">No data for this selection.</td></tr>`}</tbody></table></div>`).join('')}

function exportPDF(rep) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), M = 40;
  doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 64, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(A.ref.org.name, M, 28);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(CFG.appName + ' · generated ' + fmtDT(new Date()), M, 46);
  let y = 96;
  doc.setTextColor(20, 32, 31); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(rep.title, M, y); y += 18;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(91, 107, 105); doc.text([rep.subtitle, rep.period].filter(Boolean).join(' · '), M, y); y += 20;
  if (rep.kpis && rep.kpis.length) {
    doc.autoTable({ startY: y, margin: { left: M, right: M }, theme: 'plain', styles: { fontSize: 9, cellPadding: 5 },
      body: chunk(rep.kpis, 4).map(row => row.map(([l, v]) => ({ content: v + '\n' + l, styles: { fontStyle: 'bold' } }))),
      didParseCell: d => { d.cell.styles.fillColor = [246, 248, 247]; d.cell.styles.lineColor = [255, 255, 255]; d.cell.styles.lineWidth = 3; } });
    y = doc.lastAutoTable.finalY + 14;
  }
  doc.setTextColor(20, 32, 31); doc.setFontSize(10);
  (rep.summary || []).forEach(p => { const lines = doc.splitTextToSize(p, W - 2 * M); if (y + lines.length * 13 > 790) { doc.addPage(); y = 50; } doc.text(lines, M, y); y += lines.length * 13 + 6; });
  const cv = $('repchart');
  if (cv) {
    const h = (W - 2 * M) * cv.height / cv.width;
    if (y + h > 790) { doc.addPage(); y = 50; }
    doc.setFont('helvetica', 'bold'); doc.text(rep.chart.title || '', M, y + 4); doc.setFont('helvetica', 'normal');
    doc.addImage(cv.toDataURL('image/png', 1), 'PNG', M, y + 12, W - 2 * M, h); y += h + 26;
  }
  (rep.tables || []).forEach(t => {
    if (y > 740) { doc.addPage(); y = 50; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(t.title, M, y); doc.setFont('helvetica', 'normal');
    doc.autoTable({ startY: y + 8, margin: { left: M, right: M }, head: [t.cols], body: t.rows.length ? t.rows.map(r => r.map(String)) : [['No data']],
      styles: { fontSize: 8.5, cellPadding: 4 }, headStyles: { fillColor: [20, 32, 31] }, alternateRowStyles: { fillColor: [246, 248, 247] } });
    y = doc.lastAutoTable.finalY + 22;
  });
  if (rep.footnote) { if (y > 760) { doc.addPage(); y = 50; } doc.setFontSize(8.5); doc.setTextColor(91, 107, 105); doc.text(doc.splitTextToSize(rep.footnote, W - 2 * M), M, y); }
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(138, 152, 150); doc.text(`Page ${i} of ${pages} · Contains aggregated data only — no personal information`, M, 822); }
  doc.save(fileName(rep, 'pdf'));
}
const chunk = (arr, n) => arr.reduce((acc, x, i) => (i % n ? acc[acc.length - 1].push(x) : acc.push([x]), acc), []);
const fileName = (rep, ext) => (rep.title + ' ' + rep.period).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.' + ext;

function exportXLSX(rep) {
  const wb = XLSX.utils.book_new();
  const summary = [[rep.title], [A.ref.org.name], [[rep.subtitle, rep.period].filter(Boolean).join(' · ')], ['Generated', fmtDT(new Date())], []];
  (rep.kpis || []).forEach(([l, v]) => summary.push([l, v]));
  if (rep.summary && rep.summary.length) { summary.push([]); rep.summary.forEach(p => summary.push([p])); }
  if (rep.footnote) { summary.push([]); summary.push([rep.footnote]); }
  const ws = XLSX.utils.aoa_to_sheet(summary); ws['!cols'] = [{ wch: 40 }, { wch: 22 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Summary');
  (rep.tables || []).forEach((t, i) => {
    const s = XLSX.utils.aoa_to_sheet([t.cols, ...t.rows.map(r => r.map(v => (typeof v === 'string' && /^-?\d[\d\s\u00a0\u202f]*(\.\d+)?$/.test(v)) ? Number(v.replace(/[\s\u00a0\u202f]/g, '')) : v))]);
    s['!cols'] = t.cols.map((c, j) => ({ wch: j ? 16 : 34 }));
    XLSX.utils.book_append_sheet(wb, s, (t.sheet || t.title).replace(/[\\/?*[\]:]/g, '').slice(0, 31) || ('Table ' + (i + 1)));
  });
  XLSX.writeFile(wb, fileName(rep, 'xlsx'));
}

  $('page').innerHTML = `
    <div class="filters">
      ${role() === 'donor_viewer' ? `<b>${esc(nameOf(donors, DD.donor))}</b>` : `<span class="lbl">Donor</span><select class="i" id="d_donor">${opts(donors, DD.donor)}</select>`}
      <span class="lbl">From</span><input class="i" type="date" id="d_from" value="${DD.from}">
      <span class="lbl">To</span><input class="i" type="date" id="d_to" value="${DD.to}">
      <span class="faint" style="font-size:12.5px">Only services linked to this donor's funded programmes, Hubs and funding dates are counted.</span>
    </div><div id="dout"><div class="spin"></div></div>`;
  if ($('d_donor')) $('d_donor').onchange = e => { DD.donor = e.target.value; DD.from = ''; vDonor().catch(fail); };
  $('d_from').onchange = e => { DD.from = e.target.value; drawDonor().catch(fail); };
  $('d_to').onchange = e => { DD.to = e.target.value; drawDonor().catch(fail); };
  await drawDonor();
}

async function drawDonor() {
  const r = await q(sb.rpc('donor_impact', { p_org: A.m.org_id, p_donor: DD.donor, p_from: DD.from, p_to: DD.to }));
  $('dout') && renderReport($('dout'), donorReport(r));
}

function donorReport(r) {
  const T = r.totals || {};
  const months = (r.by_month || []);
  const perBen = T.unique_beneficiaries ? r.total_funding / T.unique_beneficiaries : null;
  const progLines = (r.by_programme || []).map(p => `${p.programme}: ${fmtN(p.unique)} people reached through ${fmtN(p.interactions)} service interactions (${fmtN(p.completed)} completed, ${fmtN(p.referred)} referred on)${p.avg_rating ? ', rated ' + Number(p.avg_rating).toFixed(1) + '/5' : ''}.`);
  return {
    title: 'Donor Impact Report', subtitle: r.donor ? r.donor.name : '', period: fmtDate(r.period.from) + ' – ' + fmtDate(r.period.to),
    kpis: [['Funding allocated', fmtR(r.total_funding)], ['Unique beneficiaries', fmtN(T.unique_beneficiaries)], ['Service interactions', fmtN(T.interactions)],
           ['New beneficiaries', fmtN(T.new_beneficiaries)], ['Services completed', fmtN(T.completed)], ['Referrals', fmtN(T.referred)],
           ['Requests resolved', fmtPct(T.resolved_pct)], ['Avg satisfaction', T.avg_rating ? Number(T.avg_rating).toFixed(2) + '/5' : '–'],
           ['Hubs reached', fmtN(T.hubs_reached)], ['Communities reached', fmtN(T.communities_reached)]],
    summary: [
      `${r.donor ? r.donor.name : 'This donor'} contributed ${fmtR(r.total_funding)} to ${A.ref.org.name}. Between ${fmtDate(r.period.from)} and ${fmtDate(r.period.to)}, the funded programmes reached ${fmtN(T.unique_beneficiaries)} unique beneficiaries across ${fmtN(T.hubs_reached)} Hubs and ${fmtN(T.communities_reached)} communities, through ${fmtN(T.interactions)} recorded service interactions.`,
      ...progLines,
      `${fmtPct(T.resolved_pct)} of actioned requests were resolved, either directly or by referral, and beneficiaries gave an average satisfaction rating of ${T.avg_rating ? Number(T.avg_rating).toFixed(1) : '–'}/5 across ${fmtN(T.feedback_count)} feedback responses.` +
        (perBen ? ` This equates to ${fmtR(perBen)} of funding per beneficiary reached so far.` : '')
    ],
    chart: { title: 'People reached per month', labels: months.map(m => monthLabel(m.label)), datasets: [{ label: 'Service interactions', data: months.map(m => m.value) }, { label: 'Unique beneficiaries', type: 'line', data: months.map(m => m.unique) }] },
    tables: [
      { title: 'Funding allocations', sheet: 'Allocations', cols: ['Programme', 'Hub', 'Amount', 'From', 'To'], num: false, rows: (r.allocations || []).map(a => [a.programme, a.hub, fmtR(a.amount), fmtDate(a.start), fmtDate(a.end)]) },
      { title: 'Programme performance', sheet: 'Programmes', cols: ['Programme', 'Funding', 'Unique beneficiaries', 'Interactions', 'Completed', 'Referred', 'Avg rating', 'Funding per beneficiary'],
        rows: (r.by_programme || []).map(p => [p.programme, fmtR(p.funding), fmtN(p.unique), fmtN(p.interactions), fmtN(p.completed), fmtN(p.referred), p.avg_rating ? Number(p.avg_rating).toFixed(2) : '–', p.unique ? fmtR(p.funding / p.unique) : '–']) },
      { title: 'Reach by Hub', sheet: 'Hubs', cols: ['Hub', 'Interactions', 'Unique beneficiaries'], rows: (r.by_hub || []).map(x => [x.label, fmtN(x.value), fmtN(x.unique)]) },
      { title: 'Services delivered by category', sheet: 'Categories', cols: ['Service category', 'Interactions'], rows: (r.by_category || []).map(x => [x.label, fmtN(x.value)]) },
      { title: 'Beneficiaries by age group', sheet: 'Age', cols: ['Age group', 'Beneficiaries'], rows: (r.by_age || []).map(x => [x.label, fmtN(x.value)]) },
      { title: 'Beneficiaries by gender', sheet: 'Gender', cols: ['Gender', 'Beneficiaries'], rows: (r.by_gender || []).map(x => [x.label, fmtN(x.value)]) },
      { title: 'Top communities', sheet: 'Communities', cols: ['Community', 'Beneficiaries'], rows: (r.by_community || []).map(x => [x.label, fmtN(x.value)]) }
    ],
    footnote: 'These figures measure outputs (reach and services delivered) and early outcomes (resolution and satisfaction). They are not a financial or social return on investment (SROI) calculation, which needs additional outcome verification and an agreed methodology. No personal information about beneficiaries is included in this report.'
  };
}

/* =====================================================================
   REPORTS & EXPORT (Module 8)

const REPORTS = [
  ['daily', 'Daily Hub Visitor Report'], ['monthly', 'Monthly Hub Performance Report'], ['quarterly', 'Quarterly Programme Performance Report'],
  ['donor', 'Donor-Specific Impact Report'], ['demographic', 'Community Demographic Report'], ['demand', 'Service Demand Analysis'],
  ['satisfaction', 'Visitor Satisfaction Report'], ['reach', 'Programme Reach and Participation Report'], ['referral', 'Referral and Follow-up Report'],
  ['unmet', 'Unmet Community Needs Report'], ['ytd', 'Year-to-Date Organisational Impact Report']
];
const RS = { type: 'monthly', hub: '', day: today(), month: today().slice(0, 7), quarter: '', from: addDays(today(), -90), to: today(), donor: '' };
function quarters() { const out = []; const d = new Date(); for (let i = 0; i < 6; i++) { const y = d.getFullYear(), qn = Math.floor(d.getMonth() / 3) + 1; out.push({ id: `${y}-Q${qn}`, name: `Q${qn} ${y} (${['Jan–Mar', 'Apr–Jun', 'Jul–Sep', 'Oct–Dec'][qn - 1]})` }); d.setMonth(d.getMonth() - 3); } return out; }
function periodFor(t) {
  if (t === 'daily') return [RS.day, RS.day];
  if (t === 'monthly') { const [y, m] = RS.month.split('-').map(Number); return [RS.month + '-01', new Date(y, m, 0).toLocaleDateString('en-CA')]; }
  if (t === 'quarterly') { const [y, qq] = (RS.quarter || quarters()[0].id).split('-Q').map(Number); return [`${y}-${String(qq * 3 - 2).padStart(2, '0')}-01`, new Date(y, qq * 3, 0).toLocaleDateString('en-CA')]; }
  if (t === 'ytd') return [today().slice(0, 4) + '-01-01', today()];
  return [RS.from, RS.to];
}

async function vReports() {
  const hubs = myHubs();
  const t = RS.type;
  if (!RS.quarter) RS.quarter = quarters()[0].id;
  if (!RS.donor && A.ref.donors.length) RS.donor = A.ref.donors[0].id;
  $('page').innerHTML = `
    <div class="filters">
      <span class="lbl">Report</span><select class="i" id="r_type">${opts(REPORTS.map(([id, name]) => ({ id, name })), t)}</select>
      ${t === 'donor' ? `<select class="i" id="r_donor">${opts(A.ref.donors, RS.donor)}</select>` : `<select class="i" id="r_hub">${opts(hubs, RS.hub, t === 'daily' ? null : 'All hubs')}</select>`}
      ${t === 'daily' ? `<input class="i" type="date" id="r_day" value="${RS.day}">` : ''}
      ${t === 'monthly' ? `<input class="i" type="month" id="r_month" value="${RS.month}">` : ''}
      ${t === 'quarterly' ? `<select class="i" id="r_quarter">${opts(quarters(), RS.quarter)}</select>` : ''}

    </div><div id="rout"><div class="spin"></div></div>`;
  if (t === 'daily' && !RS.hub && hubs[0]) RS.hub = hubs[0].id;
  const bindF = (id, k, redraw) => { if ($(id)) $(id).onchange = e => { RS[k] = e.target.value; redraw ? vReports().catch(fail) : drawReport().catch(fail); }; };
  bindF('r_type', 'type', true); bindF('r_hub', 'hub'); bindF('r_day', 'day'); bindF('r_month', 'month'); bindF('r_quarter', 'quarter'); bindF('r_from', 'from'); bindF('r_to', 'to'); bindF('r_donor', 'donor');
  await drawReport();
}

  const out = $('rout'); out.innerHTML = '<div class="spin"></div>';
  const t = RS.type, [from, to] = periodFor(t);
  if (t === 'daily' && !RS.hub) { out.innerHTML = '<div class="empty">Choose a Hub for the daily report.</div>'; return; }
  if (t === 'donor') { if (!RS.donor) { out.innerHTML = '<div class="empty">No donors set up yet.</div>'; return; } const r = await q(sb.rpc('donor_impact', { p_org: A.m.org_id, p_donor: RS.donor, p_from: from, p_to: to })); return renderReport(out, donorReport(r)); }
  const F = { hub: RS.hub };
  const rows = applyFilters(await facts(from, to), F);
  const M = metrics(rows);
  const hubName = RS.hub ? nameOf(A.ref.hubs, RS.hub) : 'All hubs';
  const period = from === to ? fmtDate(from) : fmtDate(from) + ' – ' + fmtDate(to);

  let rep;

  if (t === 'daily') {

  } else if (t === 'monthly' || t === 'ytd') {

          rows: hubs.map(h => { const m = metrics(rows.filter(r => r.hub_id === h.id)); return [h.name, fmtN(m.visits), fmtN(m.unique), fmtN(m.newBen), fmtN(m.delivered), fmtN(m.referrals), fmtN(m.outstanding), fmtPct(m.resolution), m.avgRating ? m.avgRating.toFixed(2) : '–']; }) },

      summary: [`${fmtN(people.length)} different people from ${fmtN(M.communities)} communities used the Hubs in this period. The largest groups were from ${comm.slice(0, 3).map(c => c[0] + ' (' + c[1] + ')').join(', ')}.`],

  } else if (t === 'referral') {
    const refs = rows.filter(r => r.status === 'referred');
    const fu = await q((() => { let qq = sb.from('visit_services').select('id, status, follow_up_date, category_id, visit:visits!inner(ticket_no, hub_id, visited_at)').eq('org_id', A.m.org_id).eq('status', 'follow_up').order('follow_up_date', { ascending: true, nullsFirst: false }).limit(300); if (RS.hub) qq = qq.eq('visit.hub_id', RS.hub); return qq; })());
    const byOrg = countBy(refs, r => r.referral_org || 'Not recorded');
    rep = { title: 'Referral and Follow-up Report', subtitle: hubName, period, kpis: [['Referrals', fmtN(refs.length)], ['Partner organisations', fmtN(byOrg.length)], ['People referred', fmtN(uniq(refs.map(r => r.visitor_id)).length)], ['Open follow-ups (all time)', fmtN(fu.length)], ['Overdue follow-ups', fmtN(fu.filter(f => f.follow_up_date && f.follow_up_date < today()).length)]],
      summary: [`${fmtN(refs.length)} referrals were made to ${fmtN(byOrg.length)} external organisations. The most common referral partners were ${byOrg.slice(0, 3).map(x => x[0] + ' (' + x[1] + ')').join(', ') || '—'}.`],
      chart: { title: 'Referrals by partner organisation', horizontal: true, height: Math.max(180, byOrg.length * 38), labels: byOrg.map(x => x[0]), datasets: [{ label: 'Referrals', data: byOrg.map(x => x[1]) }] },
      tables: [{ title: 'Referrals by organisation and service', sheet: 'Referrals', cols: ['Organisation', 'Referrals', ...A.ref.cats.filter(c => refs.some(r => r.category_id === c.id)).map(c => c.name)],
          rows: byOrg.map(([o, n]) => [o, fmtN(n), ...A.ref.cats.filter(c => refs.some(r => r.category_id === c.id)).map(c => fmtN(refs.filter(r => (r.referral_org || 'Not recorded') === o && r.category_id === c.id).length))]) },
        { title: 'Open follow-ups', sheet: 'Follow-ups', num: false, cols: ['Hub', 'Visit date', 'Ticket', 'Service', 'Follow-up due'], rows: fu.map(f => [nameOf(A.ref.hubs, f.visit.hub_id), fmtDate(f.visit.visited_at), f.visit.ticket_no, nameOf(A.ref.cats, f.category_id), f.follow_up_date ? fmtDate(f.follow_up_date) + (f.follow_up_date < today() ? ' (overdue)' : '') : 'Not set']) }] };
  } else if (t === 'unmet') {
    const un = rows.filter(r => !r.is_available);
    const byCat = countBy(un, r => r.category_name);
    const texts = await all(() => { let qq = sb.from('visits').select('hub_id, visited_at, unmet_other').eq('org_id', A.m.org_id).not('unmet_other', 'is', null)
      .gte('visited_at', new Date(from + 'T00:00:00+02:00').toISOString()).lt('visited_at', new Date(addDays(to, 1) + 'T00:00:00+02:00').toISOString()); if (RS.hub) qq = qq.eq('hub_id', RS.hub); return qq; });
    rep = { title: 'Unmet Community Needs Report', subtitle: hubName, period, kpis: [['Unmet requests', fmtN(un.length)], ['People affected', fmtN(uniq(un.map(r => r.visitor_id)).length)], ['Service gaps', fmtN(byCat.length)], ['Share of all requests', fmtPct(pct(un.length, rows.length))]],
      summary: [un.length ? `Visitors asked for ${fmtN(un.length)} services that their Hub does not offer, affecting ${fmtN(uniq(un.map(r => r.visitor_id)).length)} people. The largest gaps are ${byCat.slice(0, 3).map(x => x[0] + ' (' + x[1] + ')').join(', ')}. This is evidence for new programmes and funding applications.` : 'No unmet needs were recorded for this selection.'],
      chart: byCat.length ? { title: 'Unmet requests by service', horizontal: true, height: Math.max(160, byCat.length * 42), labels: byCat.map(x => x[0]), datasets: [{ label: 'Unmet requests', data: byCat.map(x => x[1]), backgroundColor: '#eb6834' }] } : null,
      tables: [{ title: 'Unmet needs by Hub', sheet: 'By Hub', cols: ['Hub', 'Service', 'Requests', 'People'],
          rows: Object.entries(groupBy(un, r => r.hub_name + '|' + r.category_name)).sort((a, b) => b[1].length - a[1].length).map(([k, v]) => [...k.split('|'), fmtN(v.length), fmtN(uniq(v.map(r => r.visitor_id)).length)]) },
        { title: 'Other needs described by visitors', sheet: 'Described needs', num: false, cols: ['Date', 'Hub', 'Need'], rows: texts.map(x => [fmtDate(x.visited_at), nameOf(A.ref.hubs, x.hub_id), x.unmet_other]) }] };
  }
  renderReport(out, rep);
}

const hubInitials = n => (n || 'H').split(/\s+/).filter(x => /^[A-Za-z]/.test(x) && !/^(of|the|and|community|hub)$/i.test(x)).slice(0, 2).map(x => x[0]).join('').toUpperCase() || 'H';

function simpleCrud({ table, title, rows, cols, render, fields, defaults = {}, allowDelete }) {
  $('aout').innerHTML = `<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn" id="addRow">+ Add ${title}</button></div>
    ${tbl([...cols, ''], rows.map(r => `<tr>${render(r).map(c => `<td>${c}</td>`).join('')}<td style="white-space:nowrap"><button class="btn sm sec" data-e="${r.id}">Edit</button>${allowDelete ? ` <button class="btn sm danger" data-d="${r.id}">Delete</button>` : ''}</td></tr>`))}`;
  const form = r => modal((r.id ? 'Edit ' : 'Add ') + title, `<div class="fld">${fields.map(f => fld(f.label,
      f.type === 'select' ? `<select class="i" data-k="${f.k}">${f.options(r[f.k])}</select>` :
      f.type === 'textarea' ? `<textarea class="i" data-k="${f.k}">${esc(r[f.k] || '')}</textarea>` :
      f.type === 'bool' ? `<select class="i" data-k="${f.k}" data-bool>${opts([{ id: 'true', name: f.yes || 'Active' }, { id: 'false', name: f.no || 'Inactive' }], String(r[f.k] !== false))}</select>` :
      `<input class="i" data-k="${f.k}" type="${f.type || 'text'}" value="${esc(r[f.k] == null ? '' : r[f.k])}">`)).join('')}</div>`,
    { save: async w => {
      const row = Object.assign({ org_id: A.m.org_id }, defaults);
      w.querySelectorAll('[data-k]').forEach(el => { let v = el.value; if (el.hasAttribute('data-bool')) v = v === 'true'; else if (el.type === 'number') v = v === '' ? null : Number(v); else if (v === '') v = null; row[el.dataset.k] = v; });
      const miss = fields.find(f => f.req && (row[f.k] == null || row[f.k] === ''));
      if (miss) { toast('Please fill in ' + miss.label, true); return false; }
      if (r.id) await q(sb.from(table).update(row).eq('id', r.id)); else await q(sb.from(table).insert(row));
      toast(title + ' saved'); await reload();
    } });
  $('addRow').onclick = () => form({ active: true });
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => form(byId(rows, b.dataset.e)));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { if (!await confirmDlg('Delete?', 'This cannot be undone.', 'Delete')) return; try { await q(sb.from(table).delete().eq('id', b.dataset.d)); toast('Deleted'); await reload(); } catch (e) { fail(e); } });
}
